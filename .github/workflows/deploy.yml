name: 🚀 Deploy Production
run-name: "${{ github.actor }} is shipping to Production!"

on:
  workflow_dispatch:
    inputs:
      chart_version:
        description: "Helm chart version to deploy (e.g. 0.0.1-abc1234 or @sha...). Defaults to '0.0.0-latest'."
        required: false
        default: 0.0.0-latest
  push:
    branches:
      - main
    paths:
      - ops/**

env:
  CHART_VERSION: ${{ github.event.inputs.chart_version || '0.0.0-latest' }}

jobs:
  deploy-production:
    environment: Production
    runs-on:
      group: on-prem

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .
            ops
          sparse-checkout-cone-mode: false
          fetch-depth: 0

      - name: Install Helm
        uses: azure/setup-helm@v5
        with:
          version: "3.17.3"

      - name: Authenticate with the remote Container Registry
        env:
          REGISTRY_LOGIN: ${{ secrets.OCI_REGISTRY_HARBOR_LOGIN }}
          REGISTRY_SECRET: ${{ secrets.OCI_REGISTRY_HARBOR_SECRET }}
        run: |
          printf '%s' "$REGISTRY_SECRET" | helm registry login -u "$REGISTRY_LOGIN" --password-stdin ${{ vars.OCI_REGISTRY }}

      # Decrypted values and the kubeconfig live in RUNNER_TEMP, which the runner
      # empties after every job; this is an on-prem runner that persists between jobs.
      - name: Decrypt values.yaml
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |
          sops -d ops/values.yaml > "$RUNNER_TEMP/values-plain.yaml"

      - name: Install kubectl
        uses: azure/setup-kubectl@v5

      - name: Deploy to Kubernetes using Helm
        working-directory: ./ops
        env:
          KUBECONFIG_CONTENT: ${{ secrets.KUBECONFIG }}
        run: |
          export KUBECONFIG="$RUNNER_TEMP/kubeconfig"
          printf '%s\n' "$KUBECONFIG_CONTENT" > "$KUBECONFIG"

          echo "🛳️ Deploying to Kubernetes (chart: $CHART_VERSION)..."
          helm upgrade --install production \
            oci://${{ vars.OCI_REGISTRY }}/uas/charts/corshub \
            --version "$CHART_VERSION" \
            --values "$RUNNER_TEMP/values-plain.yaml" \
            --namespace corshub \
            --atomic \
            --timeout 120s

          echo "Deployment successful! 🎉"