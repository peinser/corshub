name: Onboard

on:
  pull_request_target:
    paths:
      - ops/values.yaml
    types: [opened, synchronize]

jobs:
  onboard:
    environment: Production
    # Public, ephemeral runner: no cluster access is needed here, and nothing
    # (including the decrypted SOPS key) outlives the job.
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout base repo at HEAD
        uses: actions/checkout@v7
        with:
          ref: ${{ github.base_ref }}
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Fetch ops/values.yaml from PR branch only
        run: |
          git fetch origin refs/pull/${{ github.event.pull_request.number }}/head:pr-head
          git checkout pr-head -- ops/values.yaml

      - name: Verify PR touches only ops/values.yaml
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          changed=$(git diff --name-only "$(git merge-base HEAD pr-head)" pr-head)
          echo "Files changed in PR:"
          echo "$changed"

          unexpected=$(echo "$changed" | grep -v '^ops/values\.yaml$') || true
          if [ -z "$unexpected" ]; then
            exit 0
          fi

          echo "Violation: PR modifies files other than ops/values.yaml:"
          echo "$unexpected"

          api="https://api.github.com"
          auth=(-H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")

          curl_check() {
            local desc="$1"; shift
            local out
            out=$(curl -sS -w "\n%{http_code}" "$@")
            local code="${out##*$'\n'}"
            local body="${out%$'\n'*}"
            echo "[$desc] HTTP $code"
            if [ "$code" -ge 400 ]; then
              echo "  response: $body"
              return 1
            fi
          }

          curl_check "create label" -X POST "$api/repos/$REPO/labels" "${auth[@]}" \
            -d '{"name":"violation","color":"B60205","description":"PR removes or modifies existing configuration"}' || true

          curl_check "apply label" -X POST "$api/repos/$REPO/issues/$PR/labels" "${auth[@]}" \
            -d '{"labels":["violation"]}'

          body="This PR modifies files other than ops/values.yaml.\n\nOnly ops/values.yaml may be changed. This PR has been closed. Open a new one containing only your entry addition."
          curl_check "post comment" -X POST "$api/repos/$REPO/issues/$PR/comments" "${auth[@]}" \
            -d "{\"body\":\"$body\"}"

          curl_check "close PR" -X PATCH "$api/repos/$REPO/pulls/$PR" "${auth[@]}" \
            -d '{"state":"closed"}'

          exit 1

      - name: Verify PR contains only additions to ops/values.yaml
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          echo "--- raw diff ---"
          git diff HEAD -- ops/values.yaml
          echo "--- end diff ---"

          # Lines removed from ops/values.yaml, excluding:
          #   - diff headers
          #   - password_hash (absent in a legitimate rotation PR)
          #   - SOPS metadata that regenerates on every sops write
          removed=$(git diff HEAD -- ops/values.yaml \
            | grep '^-' \
            | grep -v '^---' \
            | grep -v 'password_hash' \
            | grep -v 'lastmodified:' \
            | grep -v 'mac:' \
            | grep -v 'ENC\[') || true

          echo "Removed lines after exclusions:"
          if [ -z "$removed" ]; then
            echo "  (none)"
            exit 0
          fi

          echo "$removed"

          echo "Violation detected — labelling and closing PR."

          api="https://api.github.com"
          auth=(-H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")

          curl_check() {
            local desc="$1"; shift
            local out
            out=$(curl -sS -w "\n%{http_code}" "$@")
            local code="${out##*$'\n'}"
            local body="${out%$'\n'*}"
            echo "[$desc] HTTP $code"
            if [ "$code" -ge 400 ]; then
              echo "  response: $body"
              return 1
            fi
          }

          # Create or update the violation label (422 = already exists, ignore).
          curl_check "create label" -X POST "$api/repos/$REPO/labels" "${auth[@]}" \
            -d '{"name":"violation","color":"B60205","description":"PR removes or modifies existing configuration"}' || true

          curl_check "apply label" -X POST "$api/repos/$REPO/issues/$PR/labels" "${auth[@]}" \
            -d '{"labels":["violation"]}'

          body="This PR removes or modifies existing lines in ops/values.yaml.\n\nOnly additions are permitted. Changes to existing entries or other sections of the file must go through the repository maintainers directly.\n\nRemoved lines:\n\`\`\`diff\n${removed}\n\`\`\`\n\nThis PR has been closed. Open a new one containing only the additions for your entry."
          curl_check "post comment" -X POST "$api/repos/$REPO/issues/$PR/comments" "${auth[@]}" \
            -d "{\"body\":\"$body\"}"

          curl_check "close PR" -X PATCH "$api/repos/$REPO/pulls/$PR" "${auth[@]}" \
            -d '{"state":"closed"}'

          exit 1

      - name: Install sops and age
        env:
          SOPS_VERSION: 3.12.2
          SOPS_SHA256: 14e2e1ba3bef31e74b70cf0b674f6443c80f6c5f3df15d05ffc57c34851b4998
          AGE_VERSION: 1.3.1
          AGE_SHA256: bdc69c09cbdd6cf8b1f333d372a1f58247b3a33146406333e30c0f26e8f51377
        run: |
          curl -fsSL -o "$RUNNER_TEMP/sops" \
            "https://github.com/getsops/sops/releases/download/v${SOPS_VERSION}/sops-v${SOPS_VERSION}.linux.amd64"
          echo "$SOPS_SHA256  $RUNNER_TEMP/sops" | sha256sum -c -
          sudo install -m 0755 "$RUNNER_TEMP/sops" /usr/local/bin/sops

          curl -fsSL -o "$RUNNER_TEMP/age.tar.gz" \
            "https://github.com/FiloSottile/age/releases/download/v${AGE_VERSION}/age-v${AGE_VERSION}-linux-amd64.tar.gz"
          echo "$AGE_SHA256  $RUNNER_TEMP/age.tar.gz" | sha256sum -c -
          sudo tar -xzf "$RUNNER_TEMP/age.tar.gz" -C /usr/local/bin --strip-components=1 age/age

      - name: Install Python dependencies
        run: pip3 install --break-system-packages --quiet bcrypt PyYAML

      - name: Configure git identity for bot commits
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run onboarding script
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: python3 .github/scripts/onboard.py

      - name: Commit generated credentials
        run: |
          git add -f ops/values.yaml ops/key-fingerprints.yaml
          git diff --cached --quiet && exit 0
          git commit -m "chore: issue credentials for new registry entries [skip ci]"
          git push

      - name: Close PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          api="https://api.github.com"
          auth=(-H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")

          curl_check() {
            local desc="$1"; shift
            local out
            out=$(curl -sS -w "\n%{http_code}" "$@")
            local code="${out##*$'\n'}"
            local body="${out%$'\n'*}"
            echo "[$desc] HTTP $code"
            if [ "$code" -ge 400 ]; then
              echo "  response: $body"
              return 1
            fi
          }

          curl_check "create label" -X POST "$api/repos/$REPO/labels" "${auth[@]}" \
            -d '{"name":"onboarded","color":"0E8A16","description":"Credentials successfully issued"}' || true

          curl_check "apply label" -X POST "$api/repos/$REPO/issues/$PR/labels" "${auth[@]}" \
            -d '{"labels":["onboarded"]}'

          curl_check "post comment" -X POST "$api/repos/$REPO/issues/$PR/comments" "${auth[@]}" \
            -d '{"body":"Credentials have been issued and committed directly to main. This PR is now closed. There is nothing to merge."}'

          curl_check "close PR" -X PATCH "$api/repos/$REPO/pulls/$PR" "${auth[@]}" \
            -d '{"state":"closed"}'
