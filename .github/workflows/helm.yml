name: Helm
run-name: ${{ github.actor }} is publishing the Helm chart

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches:
    - main
    - development
    paths:
    - helm/**
    - src/opa/**
  # Policy tests and chart lint gate merges; nothing is published for PRs.
  pull_request:
    paths:
    - helm/**
    - src/opa/**

jobs:

  publish:
    runs-on: ubuntu-latest

    steps:
    - name: Git Checkout
      uses: actions/checkout@v7

    - name: Install Helm
      uses: azure/setup-helm@v5
      with:
        version: "3.17.3"

    - name: Install OPA
      env:
        OPA_VERSION: 1.22.4
        OPA_SHA256: 35e3b352e715e80624ead6c89930d8585f6f7d94cdc409eb2a9fe36620dcccba
      run: |
        curl -fsSL -o "$RUNNER_TEMP/opa" \
          "https://github.com/open-policy-agent/opa/releases/download/v${OPA_VERSION}/opa_linux_amd64_static"
        echo "$OPA_SHA256  $RUNNER_TEMP/opa" | sha256sum -c -
        sudo install -m 0755 "$RUNNER_TEMP/opa" /usr/local/bin/opa

    - name: Test OPA policies
      run: make policy-test

    - name: Lint chart
      run: helm lint helm

    - name: Install crane
      if: github.event_name != 'pull_request'
      env:
        CRANE_VERSION: 0.21.5
        CRANE_SHA256: 9f823ae5ee25803161110f957b5fd4538f714d40cdf25dacb4914fefafd246bf
      run: |
        curl -fsSL -o "$RUNNER_TEMP/crane.tar.gz" \
          "https://github.com/google/go-containerregistry/releases/download/v${CRANE_VERSION}/go-containerregistry_Linux_x86_64.tar.gz"
        echo "$CRANE_SHA256  $RUNNER_TEMP/crane.tar.gz" | sha256sum -c -
        sudo tar -xzf "$RUNNER_TEMP/crane.tar.gz" -C /usr/local/bin crane

    - name: Authenticate with the remote Container Registry
      if: github.event_name != 'pull_request'
      env:
        REGISTRY_LOGIN: ${{ secrets.OCI_REGISTRY_HARBOR_LOGIN }}
        REGISTRY_SECRET: ${{ secrets.OCI_REGISTRY_HARBOR_SECRET }}
      run: |
        printf '%s' "$REGISTRY_SECRET" | helm registry login -u "$REGISTRY_LOGIN" --password-stdin ${{ vars.OCI_REGISTRY }}
        printf '%s' "$REGISTRY_SECRET" | crane auth login -u "$REGISTRY_LOGIN" --password-stdin ${{ vars.OCI_REGISTRY }}

    - name: Determine chart version
      if: github.event_name != 'pull_request'
      id: version
      run: |
        # Strip any Python pre-release suffix (.devN, .aN, .bN, .rcN) to get a
        # clean SemVer base, then append the short commit SHA as a pre-release
        # identifier so every push produces a unique, valid Helm chart version.
        BASE=$(python3 -c "
        import re, tomllib
        v = tomllib.load(open('pyproject.toml', 'rb'))['project']['version']
        print(re.sub(r'(\.(dev|a|b|rc)\d+)+$', '', v))
        ")
        echo "value=${BASE}-${GITHUB_SHA:0:7}" >> $GITHUB_OUTPUT

    - name: Set chart version and appVersion
      if: github.event_name != 'pull_request'
      run: |
        sed -i "s/^version:.*/version: ${{ steps.version.outputs.value }}/" helm/Chart.yaml
        sed -i "s/^appVersion:.*/appVersion: \"${{ steps.version.outputs.value }}\"/" helm/Chart.yaml

    - name: Sync OPA policies into Helm chart
      if: github.event_name != 'pull_request'
      # Replaces the dev-time symlinks in helm/files/opa/policies/ with real
      # file copies so the packaged chart is self-contained and portable.
      run: make helm-sync-policies

    - name: Package chart
      if: github.event_name != 'pull_request'
      run: helm package helm --destination /tmp/helm-package

    - name: Push chart to on-prem OCI registry
      if: github.event_name != 'pull_request'
      run: |
        helm push \
          /tmp/helm-package/corshub-${{ steps.version.outputs.value }}.tgz \
          oci://${{ vars.OCI_REGISTRY }}/uas/charts

    - name: Retag chart as latest
      if: github.event_name != 'pull_request'
      run: |
        crane tag \
          ${{ vars.OCI_REGISTRY }}/uas/charts/corshub:${{ steps.version.outputs.value }} \
          0.0.0-latest
